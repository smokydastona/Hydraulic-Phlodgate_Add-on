name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build and package
        run: npm run package

      - name: List artifacts
        run: ls -lh dist

      - name: Upload add-on bundle
        uses: actions/upload-artifact@v4
        with:
          name: phlodgate-mcaddon
          path: dist/*.mcaddon
          if-no-files-found: error

      - name: Upload individual packs
        uses: actions/upload-artifact@v4
        with:
          name: phlodgate-mcpacks
          path: dist/*.mcpack
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.mcaddon
            dist/*.mcpack
